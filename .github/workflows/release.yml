name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
      contents: write  # For creating releases
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Need full history for setuptools_scm
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    # This job holds the PyPI publishing token, so every tool it runs is
    # hash-pinned and the build backend comes from the same lock (--no-isolation)
    # rather than being resolved fresh from PyPI.
    - name: Install build tools
      run: pip install --require-hashes -r .github/requirements/build.txt
    
    - name: Build package
      run: python -m build --no-isolation
    
    - name: Publish to PyPI
      if: startsWith(github.ref, 'refs/tags/')
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        verbose: true
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
      with:
        files: |
          dist/*
          install.sh
          install.ps1
          upgrade.sh
        body: |
          ## Installation
          
          ### Quick Install
          
          **Linux/macOS:**
          ```bash
          curl -sSL https://raw.githubusercontent.com/Aaronontheweb/witticism/${{ github.ref_name }}/install.sh | bash
          ```
          
          **Windows:**
          ```powershell
          irm https://raw.githubusercontent.com/Aaronontheweb/witticism/${{ github.ref_name }}/install.ps1 | iex
          ```
          
          ### Upgrade
          **Linux/macOS:**
          ```bash
          curl -sSL https://raw.githubusercontent.com/Aaronontheweb/witticism/${{ github.ref_name }}/upgrade.sh | bash
          ```
          
          **Windows:** Re-run the install command above
          
          ### Manual Install
          ```bash
          pipx install witticism
          ```
          
          ## What's Changed
          See [CHANGELOG.md](https://github.com/Aaronontheweb/witticism/blob/${{ github.ref_name }}/CHANGELOG.md)
        draft: false
        prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
        generate_release_notes: true

